<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>LPR — Door Hanger</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="brand.css">
<script src="user.js"></script>
<style>
  body { background: #efeae0; padding: 60px 20px 40px; }
  /* Standard door hanger size: 4.25" × 11" — two fit on US Letter */
  @page { size: 8.5in 11in; margin: 0; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .label { font-size: 10px; letter-spacing: 3px; color: #5a5f72; text-transform: uppercase; }

  .sheet.hanger {
    width: 4.25in; height: 11in;
    background: #fff; position: relative; overflow: hidden;
    display: flex; flex-direction: column;
  }

  /* Die-cut zone guide — circle for the hanger hole */
  .cut-zone {
    position: absolute; top: 0; left: 0; right: 0;
    height: 1.6in;
    border-bottom: 1px dashed rgba(40,56,145,0.25);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(40,56,145,0.02);
  }
  .cut-zone .hole {
    width: 1.4in; height: 0.9in; border-radius: 999px;
    border: 1px dashed rgba(40,56,145,0.45);
    display: flex; align-items: center; justify-content: center;
    font-size: 7pt; letter-spacing: 2.5px; text-transform: uppercase;
    color: rgba(40,56,145,0.5); font-weight: 600;
  }
  .cut-zone .note {
    margin-top: 6px; font-size: 7pt; letter-spacing: 1.5px; text-transform: uppercase;
    color: rgba(40,56,145,0.45); font-weight: 500;
  }

  /* Header band with logo */
  .h-header {
    background: var(--lpr-blue); color: #fff;
    padding: 0.35in 0.32in 0.3in; margin-top: 1.6in;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .h-header img { width: 2.4in; height: auto; display: block; }
  .h-header .headline {
    font-size: 22pt; font-weight: 700; letter-spacing: -0.3px; text-align: center;
    margin-top: 8px;
  }
  .h-header .sub {
    font-size: 9pt; letter-spacing: 4px; text-transform: uppercase;
    color: rgba(255,255,255,0.75); font-weight: 500;
  }

  /* Body — blank fill-in lines */
  .h-body { padding: 0.32in 0.32in 0.4in; flex: 1; display: flex; flex-direction: column; gap: 0.18in; }
  .h-body .label-row {
    font-size: 8pt; letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--lpr-blue); font-weight: 700;
  }
  .h-body .write-line {
    border-bottom: 1px solid var(--lpr-ink);
    height: 30px;
  }
  .h-body .write-line.small { height: 24px; }

  /* Stamp row — date / left-by */
  .stamp-row { display: flex; gap: 14px; margin-top: 0.1in; }
  .stamp-row .field {
    flex: 1; font-size: 8pt; letter-spacing: 2px; text-transform: uppercase;
    color: var(--lpr-muted); font-weight: 600;
  }
  .stamp-row .field .line {
    height: 26px; border-bottom: 1px solid var(--lpr-ink);
    margin-top: 4px;
  }

  /* Footer contact bar */
  .h-foot {
    background: var(--lpr-blue); color: #fff;
    padding: 0.22in 0.32in;
    display: flex; flex-direction: column; gap: 4px;
    text-align: center;
  }
  .h-foot .phone {
    font-size: 16pt; font-weight: 700; letter-spacing: -0.2px;
  }
  .h-foot .email {
    font-size: 9pt; letter-spacing: 0.3px; opacity: 0.9;
  }

  @media print {
    body { background: #fff; padding: 0; }
    .stage { gap: 0; } .label { display: none; }
    .cut-zone, .cut-zone * { color: transparent !important; border-color: transparent !important; }
  }
</style>
</head>
<body>

<div class="toolbar no-print">
  <a href="index.html" class="toolbar-back">← All templates</a>
</div>

<div class="stage">
  <div class="label">DOOR HANGER — 4.25″ × 11″ · TWO PER LETTER PAGE</div>
  <div class="sheet hanger">

    <div class="cut-zone">
      <div class="hole">DIE CUT</div>
      <div class="note">For door knob</div>
    </div>

    <div class="h-header">
      <img src="assets/logo-white.png" alt="LPR Management, LLC"/>
      <div class="headline">We Stopped&nbsp;By</div>
      <div class="sub">Notice from your property manager</div>
    </div>

    <div class="h-body">
      <div class="label-row">Message</div>
      <div class="write-line"></div>
      <div class="write-line"></div>
      <div class="write-line"></div>
      <div class="write-line"></div>
      <div class="write-line"></div>
      <div class="write-line"></div>
      <div class="write-line"></div>

      <div class="stamp-row">
        <div class="field">Date / Time<div class="line"></div></div>
        <div class="field">Left by<div class="line"></div></div>
      </div>
    </div>

    <div class="h-foot">
      <div class="phone">443-402-5641</div>
      <div class="email">office@lasalleparkrealty.com</div>
    </div>

  </div>
</div>
<script src="template-tools.js"></script>
</body>
</html>
