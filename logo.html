<!-- Reference HTML for the LPR logo SVG. Inline this where needed. -->
<svg class="lpr-logo" viewBox="0 0 480 110" xmlns="http://www.w3.org/2000/svg" aria-label="LPR Management, LLC">
  <!-- Skyline mark: tall slab + cluster of vertical bars + stepped tower -->
  <g fill="currentColor">
    <!-- pinstripe cluster left of tall -->
    <rect x="2"  y="62" width="3" height="38"/>
    <rect x="8"  y="56" width="3" height="44"/>
    <rect x="14" y="64" width="3" height="36"/>
    <rect x="20" y="50" width="3" height="50"/>
    <rect x="26" y="58" width="3" height="42"/>
    <rect x="32" y="54" width="3" height="46"/>
    <!-- tall slab pair -->
    <rect x="42" y="14" width="14" height="86"/>
    <rect x="58" y="22" width="10" height="78"/>
    <!-- stepped tower right -->
    <rect x="72" y="46" width="8" height="54"/>
    <rect x="82" y="58" width="6" height="42"/>
    <rect x="90" y="68" width="5" height="32"/>
  </g>
  <!-- "LPR" wordmark -->
  <text x="118" y="74" font-family="Montserrat, sans-serif" font-weight="800" font-size="84" letter-spacing="-3" fill="currentColor">LPR</text>
  <!-- "Management, LLC" -->
  <text x="120" y="100" font-family="Montserrat, sans-serif" font-weight="500" font-size="20" letter-spacing="0" fill="currentColor">Management, LLC</text>
</svg>
