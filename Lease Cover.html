<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>LPR — Lease Cover Page</title>
<link rel="stylesheet" href="brand.css">
<script src="user.js"></script>
<style>
  body { background: #efeae0; padding: 60px 20px 40px; }
  @page { size: 8.5in 11in; margin: 0; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .label-h { font-size: 10px; letter-spacing: 3px; color: #6a6a6a; text-transform: uppercase; }
  .sheet.cover { width: 8.5in; height: 11in; background: #fff; position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .cover-band { height: 4.2in; background: var(--lpr-blue); color: #fff; padding: 0.85in 0.85in 0.5in; position: relative; }
  .cover-band::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: linear-gradient(to right, #d6a35a 0%, #d6a35a 30%, rgba(255,255,255,0.4) 30%); }
  .cover-band img { height: 1.1in; width: auto; }
  .cover-band .doc-type { font-size: 9pt; letter-spacing: 4px; text-transform: uppercase; color: rgba(255,255,255,0.7); font-weight: 500; margin-top: 0.6in; }
  .cover-band .doc-title { font-size: 36pt; font-weight: 700; letter-spacing: -0.5px; line-height: 1.05; margin-top: 12px; }
  .cover-body { flex: 1; padding: 0.7in 0.85in; display: flex; flex-direction: column; gap: 0.45in; }
  .cover-section { border-top: 1px solid var(--lpr-rule); padding-top: 18px; display: grid; grid-template-columns: 1.4in 1fr; gap: 24px; }
  .cover-section .key { font-size: 9pt; letter-spacing: 2.5px; text-transform: uppercase; color: var(--lpr-blue); font-weight: 600; padding-top: 4px; }
  .cover-section .val { font-size: 12pt; line-height: 1.5; color: var(--lpr-ink); }
  .cover-section .val .placeholder { display: inline-block; min-width: 3in; border-bottom: 1px solid var(--lpr-rule); color: var(--lpr-muted); font-style: italic; }
  .cover-footer { padding: 0.4in 0.85in; border-top: 1px solid var(--lpr-rule); display: flex; justify-content: space-between; align-items: center; font-size: 8pt; letter-spacing: 2px; text-transform: uppercase; color: var(--lpr-muted); font-weight: 500; }
  .cover-footer .right { color: var(--lpr-blue); font-weight: 600; }
  @media print { body { background: #fff; padding: 0; } .stage { gap: 0; } .label-h { display: none; } }
</style>
</head>
<body>
<div class="toolbar no-print">
  <a href="index.html" class="toolbar-back">← All templates</a>
  <button onclick="window.print()">Print</button>
</div>
<div class="stage">
  <div class="label-h">LEASE COVER PAGE — US LETTER</div>
  <div class="sheet cover">
    <div class="cover-band">
      <img src="assets/logo-white.png" alt="LPR Management, LLC"/>
      <div class="doc-type">Residential Lease Agreement</div>
      <div class="doc-title">Lease & <br/>Rental Agreement</div>
    </div>
    <div class="cover-body">
      <div class="cover-section"><div class="key">Property</div><div class="val"><div><span data-tenant-field="address_line1"></span></div><div style="margin-top:6px;"><span data-tenant-field="city"></span>, <span data-tenant-field="state"></span> <span data-tenant-field="zip"></span></div></div></div>
      <div class="cover-section"><div class="key">Landlord</div><div class="val"><div>LPR Management, LLC</div><div style="margin-top:6px; color:var(--lpr-muted); font-size:10pt;">on behalf of <span class="placeholder" style="min-width:2.6in;">[Owner Name]</span></div></div></div>
      <div class="cover-section"><div class="key">Tenant(s)</div><div class="val"><div><span data-tenant-field="first_name"></span> <span data-tenant-field="last_name"></span></div></div></div>
    </div>
    <div class="cover-footer"><span></span><span class="right">LPR Management, LLC</span></div>
  </div>
</div>
<script src="tenants.js"></script>
<script src="template-tools.js"></script>
</body>
</html>
