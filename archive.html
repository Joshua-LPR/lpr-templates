<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>LPR — Template Archive</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="brand.css">
<script src="user.js"></script>
<style>
  body { background: #efeae0; min-height: 100vh; padding: 0; }
  .container { max-width: 1180px; margin: 0 auto; padding: 56px 32px 80px; }

  .archive-header {
    display: flex; align-items: center; justify-content: space-between;
    background: #fff; border-radius: 12px; padding: 32px 40px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06); margin-bottom: 36px;
  }
  .archive-header .left h1 {
    font-size: 26px; font-weight: 700; color: var(--lpr-ink);
    margin: 0 0 4px; letter-spacing: -0.3px;
  }
  .archive-header .left p {
    font-size: 13px; color: var(--lpr-muted); margin: 0; line-height: 1.55;
  }
  .archive-header a.back {
    font-family: inherit; font-size: 12px; font-weight: 500;
    background: var(--lpr-blue); color: #fff; padding: 10px 18px;
    border-radius: 999px; text-decoration: none;
    white-space: nowrap;
  }
  .archive-header a.back:hover { background: var(--lpr-blue-deep); }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: #fff; border-radius: 10px; overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    display: flex; flex-direction: column; position: relative;
    opacity: 0.8; transition: opacity 0.15s;
  }
  .card:hover { opacity: 1; }
  .card .thumb {
    height: 160px; display: flex; align-items: center; justify-content: center;
    background: #fbf9f5; border-bottom: 1px solid var(--lpr-rule); padding: 14px;
  }
  .card .body { padding: 16px 18px 18px; }
  .card h3 { font-size: 15px; font-weight: 700; color: var(--lpr-ink); margin: 0 0 4px; }
  .card .role { font-size: 10px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--lpr-muted); font-weight: 600; margin-bottom: 6px; }
  .card .actions {
    display: flex; gap: 8px; margin-top: 12px;
  }
  .card .actions button {
    flex: 1; font-family: inherit; font-size: 11px; font-weight: 600;
    letter-spacing: 0.5px; padding: 7px 10px; border-radius: 999px;
    cursor: pointer; border: 1px solid var(--lpr-rule); background: #fff;
    color: var(--lpr-ink);
  }
  .card .actions .restore-btn:hover { background: var(--lpr-blue); color: #fff; border-color: var(--lpr-blue); }
  .card .actions .delete-btn { color: #c33; border-color: #c33; }
  .card .actions .delete-btn:hover { background: #c33; color: #fff; }

  .empty {
    background: #fff; border-radius: 12px; padding: 60px 40px;
    text-align: center; color: var(--lpr-muted); font-size: 14px; line-height: 1.6;
    border: 1px dashed var(--lpr-rule);
  }
  .empty strong { color: var(--lpr-ink); font-size: 16px; display: block; margin-bottom: 6px; }
  .empty a { color: var(--lpr-blue); }

  .toolbar-row {
    display: flex; gap: 10px; align-items: center; margin-bottom: 24px;
  }
  .toolbar-row button {
    font-family: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.5px;
    background: #fff; border: 1px solid var(--lpr-rule); color: var(--lpr-ink);
    padding: 8px 14px; border-radius: 999px; cursor: pointer;
  }
  .toolbar-row button:hover { background: var(--lpr-blue); color: #fff; border-color: var(--lpr-blue); }
  .toolbar-row .restore-all { background: var(--lpr-blue); color: #fff; border-color: var(--lpr-blue); }
  .toolbar-row .restore-all:hover { background: var(--lpr-blue-deep); }
  .toolbar-row .count { margin-left: auto; font-size: 12px; color: var(--lpr-muted); }

  .arch-search-wrap { position: relative; margin-bottom: 20px; display: none; }
  .arch-search-wrap input {
    width: 100%; box-sizing: border-box; padding: 11px 38px 11px 16px;
    border: 1.5px solid #ddd; border-radius: 8px; background: #fff;
    font-family: inherit; font-size: 13px; color: var(--lpr-ink);
    outline: none; transition: border-color .15s;
  }
  .arch-search-wrap input:focus { border-color: var(--lpr-blue); }
  .arch-search-wrap input::placeholder { color: var(--lpr-muted); }
  .arch-search-wrap .arch-search-clear {
    position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: #bbb; font-size: 14px;
    cursor: pointer; padding: 4px; line-height: 1; display: none;
  }
  .arch-search-wrap .arch-search-clear:hover { color: var(--lpr-ink); }
  .arch-search-none { text-align: center; color: var(--lpr-muted); font-size: 13px; padding: 24px 0; display: none; }
</style>
</head>
<body>

<div class="container">

  <div class="archive-header">
    <div class="left">
      <h1>Archive</h1>
      <p>Templates you've archived from the main page. Restore them anytime — they go back to their original section.</p>
    </div>
    <a class="back" href="index.html">← Back to Templates</a>
  </div>

  <div class="toolbar-row" id="toolbar" style="display:none;">
    <button class="restore-all" id="restore-all">Restore All</button>
    <span class="count" id="count"></span>
  </div>

  <div class="arch-search-wrap" id="arch-search-wrap">
    <input id="arch-search" type="text" placeholder="Search archived…" autocomplete="off" spellcheck="false"/>
    <button class="arch-search-clear" id="arch-search-clear" title="Clear">✕</button>
  </div>
  <div class="arch-search-none" id="arch-search-none">No archived templates match your search.</div>

  <div id="archive-grid"></div>

</div>

<script>
(function () {
  // Mapping of built-in template file → display info
  const TEMPLATES = {
    "Business Card.html":            { title: "Business Card",              role: "3.5″ × 2″ · Personal" },
    "Business Card Company.html":    { title: "Business Card — Company",    role: "3.5″ × 2″ · Company" },
    "Letterhead Clean.html":         { title: "Letterhead",                 role: "8.5″ × 11″ · US Letter" },
    "Letterhead.html":               { title: "Letterhead with Watermark",  role: "8.5″ × 11″ · US Letter" },
    "Letter Watermark.html":         { title: "Letter Watermark",           role: "8.5″ × 11″ · US Letter" },
    "Envelope Premium.html":         { title: "Envelope",                   role: "9.5″ × 4.125″ · #10" },
    "Envelope.html":                 { title: "Envelope — With Stripe",     role: "9.5″ × 4.125″ · #10" },
    "Mailing Labels.html":           { title: "Mailing Labels",             role: "Avery 5160 · 30 / Sheet" },
    "Address Labels P-touch.html":   { title: "Address Labels — P-touch",  role: "DK-1201 · 29×90mm" },
    "Certificate of Mailing.html":   { title: "Certificate of Mailing",    role: "PS Form 3817" },
    "Lease Cover.html":              { title: "Lease Cover Page",           role: "8.5″ × 11″ · US Letter" },
    "Email Signature.html":          { title: "Email Signature",            role: "HTML · Gmail / Outlook" },
    "Notice Template.html":          { title: "Notice Template — Blank",    role: "8.5″ × 11″ · Blank" },
    "24-Hour Notice.html":           { title: "24-Hour Notice of Entry",    role: "8.5″ × 11″ · US Letter" },
    "Rent Increase Notice.html":     { title: "Rent Increase Notice",       role: "8.5″ × 11″ · US Letter" },
    "Non-Renewal Notice.html":       { title: "Non-Renewal Notice",         role: "8.5″ × 11″ · US Letter" },
    "Security Deposit.html":         { title: "Security Deposit Notices",   role: "8.5″ × 11″ · US Letter" },
    "Door Hanger.html":              { title: "Door Hanger",                role: "4.25″ × 11″" },
    "Yard Sign.html":                { title: "Yard Sign — For Rent",       role: "24″ × 18″" }
  };

  const KEYS = { ARCHIVED: "lpr_archived", CUSTOM: "lpr_custom_templates" };
  const read = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
  const write = (k, v) => localStorage.setItem(k, JSON.stringify(v));
  const getArchived = () => new Set(read(KEYS.ARCHIVED, []));
  const setArchived = s => write(KEYS.ARCHIVED, [...s]);
  const getCustom = () => read(KEYS.CUSTOM, {});
  const setCustom = o => write(KEYS.CUSTOM, o);

  let filterQ = '';

  function applyFilter() {
    const q = filterQ.toLowerCase().trim();
    const clearBtn = document.getElementById('arch-search-clear');
    if (clearBtn) clearBtn.style.display = q ? '' : 'none';
    const cards = document.querySelectorAll('#archive-grid .card');
    let any = false;
    cards.forEach(function (card) {
      const name = (card.querySelector('h3')?.textContent || '').toLowerCase();
      const role = (card.querySelector('.role')?.textContent || '').toLowerCase();
      const show = !q || name.includes(q) || role.includes(q);
      card.style.display = show ? '' : 'none';
      if (show) any = true;
    });
    const noneEl = document.getElementById('arch-search-none');
    if (noneEl) noneEl.style.display = (q && !any) ? '' : 'none';
  }

  function render() {
    const archived = getArchived();
    const custom = getCustom();
    const grid = document.getElementById("archive-grid");

    const items = [];
    for (const id of archived) {
      if (id.startsWith("custom:")) {
        const cid = id.slice(7);
        const t = custom[cid];
        if (t) items.push({ id, type: "custom", customId: cid, name: t.name, role: "Saved · from " + (t.base || "template") });
      } else {
        const t = TEMPLATES[id] || { title: id.replace(/\.html$/i, "").replace(/-/g, " "), role: "Template" };
        items.push({ id, type: "builtin", file: id, name: t.title, role: t.role });
      }
    }

    if (items.length === 0) {
      grid.innerHTML = `<div class="empty">
        <strong>Nothing in the archive.</strong>
        Click the ⌫ button on any template card to archive it.<br/>
        <a href="index.html">← Back to Templates</a>
      </div>`;
      document.getElementById("toolbar").style.display = "none";
      return;
    }

    document.getElementById("toolbar").style.display = "";
    document.getElementById("count").textContent = items.length + " template" + (items.length === 1 ? "" : "s") + " archived";
    document.getElementById("arch-search-wrap").style.display = "";

    grid.className = "grid";
    grid.innerHTML = "";
    for (const it of items) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="thumb">
          <img src="assets/logo-cropped.png" alt="" style="width: 60%; opacity: 0.4;"/>
        </div>
        <div class="body">
          <div class="role">${escapeHtml(it.role)}</div>
          <h3>${escapeHtml(it.name)}</h3>
          <div class="actions">
            <button class="restore-btn">Restore</button>
            ${it.type === "custom" ? '<button class="delete-btn">Delete</button>' : ""}
          </div>
        </div>`;
      card.querySelector(".restore-btn").addEventListener("click", () => {
        const a = getArchived(); a.delete(it.id); setArchived(a);
        render();
      });
      const delBtn = card.querySelector(".delete-btn");
      if (delBtn) {
        delBtn.addEventListener("click", () => {
          if (!confirm(`Permanently delete "${it.name}"? (Cannot be undone.)`)) return;
          const c = getCustom(); delete c[it.customId]; setCustom(c);
          const a = getArchived(); a.delete(it.id); setArchived(a);
          render();
        });
      }
      grid.appendChild(card);
    }
    applyFilter();
  }

  document.getElementById("restore-all").addEventListener("click", () => {
    if (!confirm("Restore all archived templates to the main page?")) return;
    setArchived(new Set());
    render();
  });

  document.getElementById('arch-search').addEventListener('input', function (e) {
    filterQ = e.target.value;
    applyFilter();
  });
  document.getElementById('arch-search-clear').addEventListener('click', function () {
    filterQ = '';
    document.getElementById('arch-search').value = '';
    applyFilter();
    document.getElementById('arch-search').focus();
  });

  document.addEventListener('keydown', function (e) {
    const s = document.getElementById('arch-search');
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA' && !document.activeElement.isContentEditable) {
      e.preventDefault();
      s.focus();
    }
    if (e.key === 'Escape' && document.activeElement === s) {
      filterQ = '';
      s.value = '';
      applyFilter();
      s.blur();
    }
  });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
  }

  render();
})();
</script>
</body>
</html>
