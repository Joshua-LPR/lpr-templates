<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LPR — Library</title>
<!-- user.js must run first so localStorage is namespaced correctly before we read -->
<script src="user.js"></script>
</head>
<body>
<script>
(function () {
  var id = new URLSearchParams(location.search).get('id');
  if (!id) { document.body.textContent = 'No template specified.'; return; }

  var t;
  try {
    var all = JSON.parse(localStorage.getItem('lpr_custom_templates') || '{}');
    t = all[id];
  } catch (e) {}

  if (!t || !t.html) {
    document.body.textContent = 'Template not found — it may have been deleted from your library.';
    return;
  }

  // document.open() replaces the current document while keeping the same
  // browsing context (window), so the file:// origin is preserved.
  // Scripts in the written HTML therefore load over file:// and localStorage works.
  // Copies saved under file:// before 2026-10-08 carry a doubled
  // <base href="X/X/"> (Save As used to prefix the folder onto its own
  // file: URL). Collapse it so anything loaded by a relative path —
  // the PDF/PNG export libraries, page-flow's icon — resolves again.
  var html = t.html.replace(/<base href="([^"]+\/)\1+">/, '<base href="$1">');

  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
