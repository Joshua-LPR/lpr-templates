<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>LPR — #10 Envelope</title>
<link rel="stylesheet" href="brand.css">
<script src="user.js"></script>
<style>
  body { background: #efeae0; padding: 60px 20px 40px; }
  @page { size: 9.5in 4.125in; margin: 0; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .label { font-size: 10px; letter-spacing: 3px; color: #6a6a6a; text-transform: uppercase; }
  .envelope { width: 9.5in; height: 4.125in; background: #fff; position: relative; overflow: hidden; page-break-after: always; }
  .env-stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 0.45in; background: var(--lpr-blue); }
  .env-return { position: absolute; top: 0.42in; left: 0.85in; display: flex; gap: 14px; align-items: center; }
  .env-return img { height: 0.7in; width: auto; flex-shrink: 0; }
  .env-return .addr { font-size: 8pt; line-height: 1.55; color: var(--lpr-ink); border-left: 1px solid var(--lpr-rule); padding-left: 12px; }
  .env-return .addr .name { font-weight: 700; color: var(--lpr-blue); font-size: 9pt; letter-spacing: 0.3px; }
  .env-recipient { position: absolute; left: 4in; top: 1.85in; font-size: 11pt; line-height: 1.5; color: var(--lpr-text); font-weight: 400; }
  .env-recipient .placeholder { color: #c8c8c8; font-style: italic; }
  /* hide address line 2 row when the span is empty */
  .env-line2:has([data-tenant-field]:empty) { display: none; }
  /* …but reveal it in edit mode so the field is clickable */
  .sheet.tt-editing .env-line2:has([data-tenant-field]:empty) { display: block; }
  /* hide the comma when city is empty */
  .env-csl:has([data-tenant-field="city"]:empty) .env-comma { display: none; }
  /* print nothing when no address has been filled in */
  @media print { .env-recipient:not(.env-rec-filled) { visibility: hidden; } }
  .env-stamp { position: absolute; top: 0.3in; right: 0.4in; width: 0.85in; height: 1in; border: 1px dashed rgba(40,56,145,0.25); display: flex; align-items: center; justify-content: center; font-size: 7pt; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(40,56,145,0.45); text-align: center; }
  .env-mark { position: absolute; bottom: 0.32in; right: 0.4in; font-size: 7pt; letter-spacing: 2.5px; text-transform: uppercase; color: var(--lpr-muted); font-weight: 500; }
  @media print { body { background: #fff; padding: 0; } .stage { gap: 0; } .label { display: none; } }
</style>
</head>
<body>
<div class="toolbar no-print">
  <a href="index.html" class="toolbar-back">← All templates</a>
  <button onclick="window.print()">Print</button>
</div>
<div class="stage">
  <div class="label">#10 ENVELOPE — 9.5″ × 4.125″</div>
  <div class="sheet envelope">
    <div class="env-stripe"></div>
    <div class="env-return">
      <img src="assets/logo-cropped.png" alt="LPR Management, LLC"/>
      <div class="addr">
        1517 Reisterstown Road, 2nd Floor<br/>
        Pikesville, MD 21208
      </div>
    </div>
    <div class="env-stamp">Postage</div>
    <div class="env-recipient" id="env-rec">
      <div><span data-tenant-field="first_name"></span> <span data-tenant-field="last_name"></span></div>
      <div><span data-tenant-field="address_line1"></span></div>
      <div class="env-line2"><span data-tenant-field="address_line2"></span></div>
      <div class="env-csl"><span data-tenant-field="city"></span><span class="env-comma">, </span><span data-tenant-field="state"></span> <span data-tenant-field="zip"></span></div>
    </div>
    <div class="env-mark">Pikesville · Maryland</div>
  </div>
</div>
<script src="tenants.js"></script>
<script src="template-tools.js"></script>
<script>
(function () {
  var rec = document.getElementById('env-rec');
  if (!rec) return;
  function check() {
    var filled = Array.from(rec.querySelectorAll('[data-tenant-field]'))
      .some(function (s) { return s.textContent.trim(); });
    rec.classList.toggle('env-rec-filled', filled);
  }
  new MutationObserver(check).observe(rec, { subtree: true, childList: true, characterData: true });
  check();
})();
</script>
</body>
</html>
